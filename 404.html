<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #2c3e50;
            padding: 20px;
        }

        .content {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .illustration {
            width: 140px;
            height: 140px;
            margin: 0 auto 10px auto;
        }

        .content h1 {
            font-size: 5rem;
            line-height: 1;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .content h2 {
            font-size: 1.75rem;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .content p {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background-color: #1e90ff;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0f78d1;
        }

        @media (max-width: 600px) {
            .content h1 {
                font-size: 3.8rem;
            }

            .content h2 {
                font-size: 1.4rem;
            }

            .content {
                padding: 30px 20px;
            }

            .illustration {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <!-- Embedded SVG Vector Illustration -->
        <div class="illustration">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" fill="#F1F5F9" />
                <path d="M65 125C65 125 80 105 100 105C120 105 135 125 135 125" stroke="#94A3B8" stroke-width="8"
                    stroke-linecap="round" />
                <circle cx="75" cy="80" r="10" fill="#64748B" />
                <circle cx="125" cy="80" r="10" fill="#64748B" />
                <path d="M140 45L160 25M45 140L25 160" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
            </svg>
        </div>

        <h1>404</h1>
        <h2>Oops! We Are Offline</h2>
        <p id="mees">The site is currently undergoing maintenance. Checking system status...</p>
        <a href="404.html" class="btn">Refresh page</a>
    </div>

    <script>
        (function monitorVisibilityGuard() {
            const HARDCODED_SIGNATURE = "axencargo";
            const API_CHECK_ENDPOINT = `http://localhost:5000/address/check?signature=${encodeURIComponent(HARDCODED_SIGNATURE)}`;
            let pollingInterval = null;

            async function checkStatus() {
                try {
                    const response = await fetch(API_CHECK_ENDPOINT);
                    const data = await response.json();

                    if (!data.success) {
                        console.warn("⚠️ API Warning/Error:", data.message || data.error);
                        return;
                    }

                    // Redirect back to index.html as soon as visibility becomes true
                    if (data.visibility === true) {
                        if (pollingInterval) clearInterval(pollingInterval);

                        window.location.href = window.location.origin + "/index.html";
                    }
                } catch (err) {
                    console.error("❌ Network fetch error:", err);
                }
            }

            // Run check immediately on page load
            checkStatus();

            // Poll backend every 5 seconds until visibility is restored
            pollingInterval = setInterval(checkStatus, 20000);
        })();
    </script>
</body>

</html>
