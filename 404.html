    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #2c3e50;
            padding: 20px;
        }

        .content {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .illustration {
            width: 140px;
            height: 140px;
            margin: 0 auto 10px auto;
        }

        .content h1 {
            font-size: 5rem;
            line-height: 1;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .content h2 {
            font-size: 1.75rem;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .content p {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background-color: #1e90ff;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0f78d1;
        }

        @media (max-width: 600px) {
            .content h1 {
                font-size: 3.8rem;
            }

            .content h2 {
                font-size: 1.4rem;
            }

            .content {
                padding: 30px 20px;
            }

            .illustration {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>
