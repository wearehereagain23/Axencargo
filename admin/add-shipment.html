    <style>
        .step-progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            position: relative;
        }

        .step-progress-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border-divider-line);
            z-index: 1;
            transform: translateY(-50%);
        }

        .step-node {
            position: relative;
            z-index: 2;
            background: var(--bg-sidebar-dark);
            border: 2px solid var(--border-divider-line);
            color: var(--text-secondary-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .step-node.active {
            border-color: var(--text-chat-green);
            background: var(--text-chat-green);
            color: #fff;
        }

        .step-pane {
            display: none;
        }

        .step-pane.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-action-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            gap: 12px;
        }
    </style>
</head>

                    </div>

                        <label class="form-label">Postal Code *</label>

                    </div>

                <!-- STEP 3: SHIPMENT DETAILS & FEES -->
                <div class="step-pane" id="step-3">
                    <h4 style="color: var(--text-chat-green); font-size: 14px; text-transform: uppercase;">Step 3: Cargo
                        & Fees Details</h4>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group-item">
                            <label class="form-label">Carrier *</label>
                            <select id="carrier" name="carrier" required class="form-control">
                                <option value="">Select Carrier</option>
                                <option value="CAR-GO">CAR-GO</option>
                                <option value="DHL">DHL</option>
                                <option value="UPS">UPS</option>
                                <option value="Amazon">Amazon</option>
                                <option value="FedEx">FedEx</option>
                            </select>
                        </div>
                        <div class="form-group-item">
                            <label class="form-label">Shipping Method *</label>
                            <select id="method" name="method" required class="form-control">
                                <option value="">Select Method</option>
                                <option value="Ocean Transport">Ocean Transport</option>
                                <option value="Air Freight">Air Freight</option>
                                <option value="Inland Transport">Inland Transport</option>
                                <option value="Intercontinental Rail">Intercontinental Rail</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group-item">
                            <label class="form-label">Total Weight *</label>
                            <input required type="text" name="weight" id="weight" class="form-control"
                                placeholder="e.g. 25 kg">
                        </div>
                        <div class="form-group-item">
                            <label class="form-label">Quantity *</label>
                            <input required type="text" name="quantity" id="quantity" class="form-control"
                                placeholder="e.g. 2">
                        </div>
                    </div>

                    <div class="form-group-item">
                        <label class="form-label">Package Type *</label>
                        <input required type="text" name="packagename" id="packagename" class="form-control"
                            placeholder="e.g. Carton Box / Wooden Crate">
                    </div>

                    <div class="form-group-item">
                        <label class="form-label">Departure Date *</label>
                        <input required type="datetime-local" name="date" id="date" class="form-control">
                    </div>

                    <!-- Restored Delivery Fee Fields -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
                        <div class="form-group-item">
                            <label class="form-label">Express Fee</label>
                            <input required type="text" name="exd" id="exd" class="form-control" placeholder="$100">
                        </div>
                        <div class="form-group-item">
                            <label class="form-label">2nd Class Fee</label>
                            <input required type="text" name="scd" id="scd" class="form-control" placeholder="$50">
                        </div>
                        <div class="form-group-item">
                            <label class="form-label">3rd Class Fee</label>
                            <input required type="text" name="tcd" id="tcd" class="form-control" placeholder="$20">
                        </div>
                    </div>

                    <div class="form-group-item">
                        <label class="form-label">Description / Manifest *</label>
                        <textarea required name="description" id="description" class="form-control" rows="2"
                            placeholder="Item contents description..."></textarea>
                    </div>

                    <div class="form-group-item">
                        <label class="form-label">Initial Comment *</label>
                        <input required type="text" name="comment" id="comment" class="form-control"
                            placeholder="Special handling notes...">
                    </div>
                </div>

                <!-- STEP 4: MEDIA UPLOAD -->
                <div class="step-pane" id="step-4">
                    <h4 style="color: var(--text-chat-green); font-size: 14px; text-transform: uppercase;">
                        Step 4: Media Upload <small
                            style="text-transform: none; color: var(--text-secondary-muted);">(Optional)</small>
                    </h4>

                    <!-- Dynamic Subscription Status Notice -->
                    <div id="shipment-image-notice"></div>

                    <div class="form-group-item"
                        style="border: 2px dashed var(--border-interactive); text-align: center; padding: 24px; border-radius: 8px;">
                        <i data-lucide="upload-cloud"
                            style="width: 48px; height: 48px; color: var(--border-interactive); margin-bottom: 8px;"></i>
                        <label class="form-label"
                            style="display: block; font-size: 13px; color: var(--text-primary-bright); margin-bottom: 6px;">
                            Combine goods into one photo and upload here (Optional)
                        </label>
                        <!-- Ensure required attribute is absent -->
                        <input type="file" name="shipment_image" id="shipment_image" class="form-control"
                            accept="image/*" style="margin-top: 10px;">
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="form-action-bar">
                    <button type="button" id="prevStepBtn" class="admin-execute-action-btn secondary-intent-btn"
                        style="display: none; width: auto; padding: 10px 20px;">Previous</button>
                    <div></div>
                    <button type="button" id="nextStepBtn" class="admin-execute-action-btn primary-intent-btn"
                        style="width: auto; padding: 10px 24px;">Next Step</button>
                    <button type="submit" id="submitFormBtn" class="admin-execute-action-btn primary-intent-btn"
                        style="display: none; width: auto; padding: 10px 24px; background: var(--text-chat-green);">Create
                        Shipment</button>
                </div>

            </form>

    <div id="spinnerModal" class="spinner-modal"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
        <div class="spinner-content" style="text-align: center; color: #fff;">
            <div class="loading-spinner"></div>
            <p style="margin-top: 12px;">Creating shipment and syncing details...</p>
        </div>
    </div>
